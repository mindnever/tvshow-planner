services:
  tvshow-planner:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUBLIC_BASE_URL: https://tv.example.com
      SECRET_KEY: change-me-to-a-long-random-string
      JELLYFIN_URL: http://jellyfin:8096
    volumes:
      - tvshow-planner-data:/data

volumes:
  tvshow-planner-data:
